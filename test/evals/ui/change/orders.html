<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders — Shopfront</title>
  <link rel="stylesheet" href="/styles/tokens.css">
  <link rel="stylesheet" href="/styles/app.css">
  <link rel="stylesheet" href="/styles/orders.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Shopfront</a>
    <nav aria-label="Main">
      <a href="/">Home</a>
      <a href="/orders" aria-current="page">Orders</a>
    </nav>
  </header>
  <main>
    <h1 class="orders-title">Orders</h1>
    <p id="status" class="status" role="status"></p>

    <section class="new-order" aria-labelledby="new-order-heading">
      <h2 id="new-order-heading">New order</h2>
      <form id="new-order" novalidate>
        <div class="field">
          <label for="customer">Customer</label>
          <input id="customer" name="customer" autocomplete="name" aria-describedby="customer-error">
          <p id="customer-error" class="field-error" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="total">Total (£)</label>
          <input id="total" name="total" inputmode="decimal" aria-describedby="total-error">
          <p id="total-error" class="field-error" aria-live="polite"></p>
        </div>
        <button class="button" type="submit">Add order</button>
      </form>
    </section>

    <div id="orders"></div>
  </main>

  <div id="details-backdrop" class="backdrop" hidden>
    <div id="details" class="dialog" role="dialog" aria-modal="true" aria-labelledby="details-title">
      <h2 id="details-title">Order details</h2>
      <dl id="details-body"></dl>
      <button class="button" type="button" id="details-close">Close</button>
    </div>
  </div>

  <script type="module" src="/js/orders.js"></script>
</body>
</html>
